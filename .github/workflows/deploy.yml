name: Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply Environment Variable Overrides
        run: |
          append_if_set() {
            if [ -n "$2" ]; then
              printf '%s=%s\n' "$1" "$2" >> .env
            fi
          }

          append_if_set VITE_NAVER_MAP_CLIENT_ID "$VITE_NAVER_MAP_CLIENT_ID"
          append_if_set VITE_KAKAO_SDK_JS_KEY "$VITE_KAKAO_SDK_JS_KEY"
          append_if_set VITE_SERVER_URL "$VITE_SERVER_URL"
          append_if_set VITE_STATIC_ONLY "$VITE_STATIC_ONLY"
          append_if_set VITE_BRIDE_PHONE "$VITE_BRIDE_PHONE"
          append_if_set VITE_BRIDE_ACCOUNT "$VITE_BRIDE_ACCOUNT"
          append_if_set VITE_BRIDE_FATHER_PHONE "$VITE_BRIDE_FATHER_PHONE"
          append_if_set VITE_BRIDE_FATHER_ACCOUNT "$VITE_BRIDE_FATHER_ACCOUNT"
          append_if_set VITE_BRIDE_MOTHER_PHONE "$VITE_BRIDE_MOTHER_PHONE"
          append_if_set VITE_BRIDE_MOTHER_ACCOUNT "$VITE_BRIDE_MOTHER_ACCOUNT"
          append_if_set VITE_GROOM_PHONE "$VITE_GROOM_PHONE"
          append_if_set VITE_GROOM_ACCOUNT "$VITE_GROOM_ACCOUNT"
          append_if_set VITE_GROOM_FATHER_PHONE "$VITE_GROOM_FATHER_PHONE"
          append_if_set VITE_GROOM_FATHER_ACCOUNT "$VITE_GROOM_FATHER_ACCOUNT"
          append_if_set VITE_GROOM_MOTHER_PHONE "$VITE_GROOM_MOTHER_PHONE"
          append_if_set VITE_GROOM_MOTHER_ACCOUNT "$VITE_GROOM_MOTHER_ACCOUNT"
        env:
          VITE_NAVER_MAP_CLIENT_ID: ${{ secrets.VITE_NAVER_MAP_CLIENT_ID }}
          VITE_KAKAO_SDK_JS_KEY: ${{ secrets.VITE_KAKAO_SDK_JS_KEY }}
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
          VITE_STATIC_ONLY: ${{ vars.VITE_STATIC_ONLY }}
          VITE_BRIDE_PHONE: ${{ secrets.VITE_BRIDE_PHONE }}
          VITE_BRIDE_ACCOUNT: ${{ secrets.VITE_BRIDE_ACCOUNT }}
          VITE_BRIDE_FATHER_PHONE: ${{ secrets.VITE_BRIDE_FATHER_PHONE }}
          VITE_BRIDE_FATHER_ACCOUNT: ${{ secrets.VITE_BRIDE_FATHER_ACCOUNT }}
          VITE_BRIDE_MOTHER_PHONE: ${{ secrets.VITE_BRIDE_MOTHER_PHONE }}
          VITE_BRIDE_MOTHER_ACCOUNT: ${{ secrets.VITE_BRIDE_MOTHER_ACCOUNT }}
          VITE_GROOM_PHONE: ${{ secrets.VITE_GROOM_PHONE }}
          VITE_GROOM_ACCOUNT: ${{ secrets.VITE_GROOM_ACCOUNT }}
          VITE_GROOM_FATHER_PHONE: ${{ secrets.VITE_GROOM_FATHER_PHONE }}
          VITE_GROOM_FATHER_ACCOUNT: ${{ secrets.VITE_GROOM_FATHER_ACCOUNT }}
          VITE_GROOM_MOTHER_PHONE: ${{ secrets.VITE_GROOM_MOTHER_PHONE }}
          VITE_GROOM_MOTHER_ACCOUNT: ${{ secrets.VITE_GROOM_MOTHER_ACCOUNT }}

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./build"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
